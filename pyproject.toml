[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudetop"
version = "0.2.0"
description = "Live terminal dashboard for Claude Code sessions, spend and subscription limits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Boulanger" }]
keywords = ["claude", "claude-code", "tui", "dashboard", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "psutil>=5.9",
    # Window focusing on Windows; every other platform skips it and the
    # 'f' key simply reports that focusing is unavailable.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
claudetop = "claudetop.__main__:main"
claudetop-wt = "claudetop.worktrees:main"

[project.urls]
Homepage = "https://github.com/JohnBoulanger/claudetop"
Issues = "https://github.com/JohnBoulanger/claudetop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claudetop"]
